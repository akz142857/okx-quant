[project]
name = "okx-quant"
version = "1.0.0"
description = "OKX spot quantitative trading, backtesting, risk management, and LLM strategy research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "websockets>=12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
    "pyarrow>=15.0",   # backtest grid parquet 缓存
]

[project.scripts]
okx-quant = "main:main"
okx-quant-watchdog = "okx_quant.ops.watchdog:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["okx_quant*"]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11.0",
]

[tool.coverage.run]
branch = true
source = ["okx_quant"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers"]
markers = [
    "unit: unit test (fast, no external IO)",
    "integration: integration test (may hit network)",
    "linux_ci_required: platform behavior that must execute without skipping in Linux CI",
]
