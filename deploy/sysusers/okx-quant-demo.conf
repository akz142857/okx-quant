# Three trader identities and independent monitor/backup identities.
u okxquant-demo-shadow - "OKX Quant Demo Shadow" /nonexistent
g okxquant-data-shadow
m okxquant-demo-shadow okxquant-data-shadow
u okxquant-monitor-shadow - "OKX Quant Shadow Monitor" /nonexistent
u okxquant-backup-shadow - "OKX Quant Shadow Backup" /nonexistent
u okxquant-restore-shadow - "OKX Quant Shadow Restore Verifier" /nonexistent
m okxquant-monitor-shadow okxquant-data-shadow
m okxquant-backup-shadow okxquant-data-shadow
m okxquant-restore-shadow okxquant-data-shadow

u okxquant-demo-active - "OKX Quant Demo Active" /nonexistent
g okxquant-data-active
m okxquant-demo-active okxquant-data-active
u okxquant-monitor-active - "OKX Quant Active Monitor" /nonexistent
u okxquant-backup-active - "OKX Quant Active Backup" /nonexistent
u okxquant-restore-active - "OKX Quant Active Restore Verifier" /nonexistent
m okxquant-monitor-active okxquant-data-active
m okxquant-backup-active okxquant-data-active
m okxquant-restore-active okxquant-data-active

u okxquant-demo-chaos - "OKX Quant Demo Chaos" /nonexistent
g okxquant-data-chaos
m okxquant-demo-chaos okxquant-data-chaos
u okxquant-monitor-chaos - "OKX Quant Chaos Monitor" /nonexistent
u okxquant-backup-chaos - "OKX Quant Chaos Backup" /nonexistent
u okxquant-restore-chaos - "OKX Quant Chaos Restore Verifier" /nonexistent
u okxquant-fault-chaos - "OKX Quant Chaos Fault Proxy" /nonexistent
m okxquant-monitor-chaos okxquant-data-chaos
m okxquant-backup-chaos okxquant-data-chaos
m okxquant-restore-chaos okxquant-data-chaos
