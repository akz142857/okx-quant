# Independent collector/signer identities. One private group per producer lets
# the signer read 0640 raw bytes without granting write access.
g oqc-capability-readers
u oqc-capability - "Canary independent capability authority" /nonexistent
m oqc-capability oqc-capability-readers
u oqc-worm - "Canary independent WORM readback verifier" /nonexistent
m oqc-worm oqc-capability-readers
u oqc-deploy-verify - "Canary independent deployment verifier" /nonexistent
m oqc-deploy-verify oqc-capability-readers
g oqc-p00
u oqc-c00 - "Canary source collector 00" /nonexistent
u oqc-s00 - "Canary source signer 00" /nonexistent
m oqc-c00 oqc-p00
m oqc-s00 oqc-p00
m oqc-s00 oqc-capability-readers
