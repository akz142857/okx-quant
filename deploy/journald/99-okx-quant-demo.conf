# Install as /etc/systemd/journald.conf.d/99-okx-quant-demo.conf.
# Size limits are host-wide; confirm they fit the host image before activation.
[Journal]
Storage=persistent
Compress=yes
Seal=yes
SplitMode=uid
SystemMaxUse=10G
SystemKeepFree=5G
RuntimeMaxUse=512M
MaxFileSec=1day
MaxRetentionSec=45day
RateLimitIntervalSec=30s
RateLimitBurst=10000
